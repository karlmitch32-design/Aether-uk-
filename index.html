<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER • Future UK Satnav</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --accent: #00f0ff;
    --accent2: #7b5cff;
    --bg-glass: rgba(6, 10, 22, 0.72);
    --border: rgba(0, 240, 255, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #03060f;
    color: #eafcff;
    -webkit-font-smoothing: antialiased;
  }

  #app { position: relative; height: 100%; width: 100%; }

  /* REAL MAP - full and clean */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #03060f;
  }
  .leaflet-control-attribution {
    background: rgba(0,0,0,0.45) !important;
    color: #6af !important;
    font-size: 9px !important;
    max-width: 140px;
    border-radius: 4px 0 0 0;
  }
  .leaflet-control-zoom { display: none !important; }

  /* TOP BAR - ultra minimal */
  #topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 12px 12px 0;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }

  #search-wrap {
    flex: 1;
    display: flex;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #search-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 16px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  #search-input::placeholder { color: rgba(0,240,255,0.4); }
  #go-btn {
    background: linear-gradient(135deg, #00d4e0, #0088aa);
    border: none;
    color: #001018;
    font-weight: 700;
    font-size: 13px;
    padding: 0 18px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  #icon-btns {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn.active {
    background: var(--accent);
    color: #001018;
    border-color: var(--accent);
  }

  /* Single floating alert */
  #alert {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
    background: rgba(255, 50, 80, 0.9);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 30px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #alert.show { opacity: 1; }
  #alert.camera { background: rgba(255,160,0,0.95); color: #111; }
  #alert.success { background: rgba(0,180,120,0.95); color: #fff; }
  #alert.info { background: rgba(0,100,180,0.9); }

  /* Minimal side controls */
  #side {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 900;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .side-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-glass);
    backdrop-filter: blur(16px);
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .side-btn.active {
    background: var(--accent);
    color: #001018;
    box-shadow: 0 0 16px rgba(0,240,255,0.4);
  }

  /* FUTURE HUD - appears only when navigating */
  #hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 950;
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
  }
  #hud.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  #maneuver {
    width: 100%;
    max-width: 340px;
    background: var(--bg-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px 20px 16px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,240,255,0.08);
    position: relative;
    overflow: hidden;
  }
  #maneuver::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(0,240,255,0.08), transparent 70%);
    pointer-events: none;
  }

  #arrow {
    font-size: 56px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(0,240,255,0.6);
    margin-bottom: 4px;
  }
  #instr {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 2px;
    line-height: 1.3;
  }
  #dist {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  #stats {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    max-width: 340px;
  }
  .stat {
    flex: 1;
    background: rgba(0,12,28,0.7);
    border: 1px solid rgba(0,240,255,0.15);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(0,240,255,0.55);
    margin-bottom: 3px;
  }
  .stat-val {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }
  #speed-val { color: #ffc14d; }
  #limit-val { color: #ff6bcb; }

  /* ETA pill */
  #eta-pill {
    position: absolute;
    top: 72px;
    left: 12px;
    z-index: 900;
    background: var(--bg-glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  #eta-pill.show { display: block; }

  /* Loader */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 2000;
    background: #03060f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #loader.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .ring {
    width: 56px;
    height: 56px;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--accent);
  }
  #loader p {
    font-size: 12px;
    color: rgba(0,240,255,0.4);
    letter-spacing: 1px;
  }

  body.night #map { filter: brightness(0.78) contrast(1.05); }
  body.night #arrow { color: #ff6bcb; text-shadow: 0 0 24px rgba(255,107,203,0.5); }
</style>
</head>
<body>
<div id="app">
  <div id="loader">
    <div class="ring"></div>
    <h1>AETHER</h1>
    <p>INITIALISING</p>
  </div>

  <div id="map"></div>

  <div id="topbar">
    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
      <button id="go-btn">GO</button>
    </div>
    <div id="icon-btns">
      <button class="icon-btn" id="locate-btn" title="My location">◎</button>
      <button class="icon-btn" id="voice-btn" title="Voice">🔊</button>
    </div>
  </div>

  <div id="alert"></div>

  <div id="eta-pill">
    <span id="eta-text">—</span> · <span id="dist-text">—</span>
  </div>

  <div id="side">
    <button class="side-btn" id="night-btn" title="Night">☾</button>
    <button class="side-btn active" id="follow-btn" title="Follow">◉</button>
    <button class="side-btn" id="clear-btn" title="Clear">✕</button>
  </div>

  <div id="hud">
    <div id="maneuver">
      <div id="arrow">↑</div>
      <div id="instr">Ready</div>
      <div id="dist">—</div>
      <div id="road-name" style="font-size:12px;color:rgba(0,240,255,0.7);margin-top:4px;min-height:16px;">—</div>
      <div id="progress-wrap" style="margin-top:10px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
        <div id="progress-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#00f0ff,#7b5cff);transition:width 0.5s;"></div>
      </div>
    </div>
    <div id="stats">
      <div class="stat">
        <div class="stat-label">Speed</div>
        <div class="stat-val" id="speed-val">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Limit</div>
        <div class="stat-val" id="limit-val">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">ETA</div>
        <div class="stat-val" id="eta-mini">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Left</div>
        <div class="stat-val" id="left-mini">—</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
  const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
  const UA = 'AetherFutureNav/2.0';

  let map, userMarker, routeLine, glowLine, destMarker;
  let pos = null;
  let steps = [];
  let stepIdx = 0;
  let following = true;
  let voiceOn = true;
  let watchId = null;
  let lastSpeak = '';
  let lastAnnounceDist = -1;
  let speed = 0;
  let currentDest = null;
  let offRouteCount = 0;
  let nearbyCameras = [];       // real OSM cameras
  let lastCameraFetch = 0;
  let lastCameraAlert = 0;
  let currentLimit = 30;        // estimated / current speed limit
  let lastOverspeedAlert = 0;
  let totalRouteDistance = 0;   // metres
  let lastRoadFetch = 0;
  let lastLimitFetch = 0;
  let currentRoadName = '';

  function init() {
    map = L.map('map', {
      zoomControl: false,
      attributionControl: true,
      preferCanvas: true
    }).setView([54.2, -2.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OSM'
    }).addTo(map);

    const icon = L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;background:#00f0ff;border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 12px #00f0ff;"></div>',
      iconSize: [18,18], iconAnchor: [9,9]
    });
    userMarker = L.marker([54.2,-2.5], {icon, zIndexOffset: 1000}).addTo(map);

    document.getElementById('go-btn').onclick = search;
    document.getElementById('search-input').onkeydown = e => { if (e.key === 'Enter') search(); };
    document.getElementById('locate-btn').onclick = locate;
    document.getElementById('voice-btn').onclick = toggleVoice;
    document.getElementById('night-btn').onclick = () => {
      document.body.classList.toggle('night');
      document.getElementById('night-btn').classList.toggle('active');
    };
    document.getElementById('follow-btn').onclick = () => {
      following = !following;
      document.getElementById('follow-btn').classList.toggle('active', following);
      if (following && pos) map.panTo([pos.lat, pos.lon]);
    };
    document.getElementById('clear-btn').onclick = clearRoute;

    locate();

    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      map.invalidateSize();
    }, 1200);

    setInterval(() => {
      if (speed < 3 && steps.length) speed = Math.min(65, speed + Math.random()*2);
      else if (!steps.length) speed = Math.max(0, speed - 1.5);
      document.getElementById('speed-val').textContent = Math.round(speed);
      checkSpeedLimit();
    }, 1100);
  }

  function locate() {
    if (!navigator.geolocation) {
      pos = {lat:51.5074, lon:-0.1278};
      userMarker.setLatLng([pos.lat, pos.lon]);
      map.setView([pos.lat, pos.lon], 13);
      alertMsg('Demo location (London)', 'info');
      return;
    }
    navigator.geolocation.getCurrentPosition(p => {
      pos = {lat: p.coords.latitude, lon: p.coords.longitude};
      userMarker.setLatLng([pos.lat, pos.lon]);
      map.setView([pos.lat, pos.lon], 15);
      alertMsg('Location locked', 'success');
    }, () => {
      pos = {lat:51.5074, lon:-0.1278};
      userMarker.setLatLng([pos.lat, pos.lon]);
      map.setView([pos.lat, pos.lon], 13);
      alertMsg('Allow GPS for live tracking', 'info');
    }, {enableHighAccuracy:true, timeout:7000});

    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(p => {
      pos = {lat: p.coords.latitude, lon: p.coords.longitude};
      userMarker.setLatLng([pos.lat, pos.lon]);
      if (p.coords.speed != null && p.coords.speed >= 0)
        speed = Math.round(p.coords.speed * 3.6);
      if (following) {
        map.panTo([pos.lat, pos.lon], {animate:true, duration:0.5});
      }
      if (steps.length) {
        advanceStep();
        checkOffRoute();
        updateProgress();
      }
      // Real OSM data
      checkNearbyCameras();
      fetchRoadAndLimit();
    }, ()=>{}, {enableHighAccuracy:true, maximumAge:2000});
  }

  async function search() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) { alertMsg('Enter a destination', 'info'); return; }
    if (!pos) { locate(); return; }

    alertMsg('Searching…', 'info');
    try {
      const r = await fetch(`${NOMINATIM}?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=gb`, {
        headers: {'User-Agent': UA}
      });
      const data = await r.json();
      if (!data.length) { alertMsg('Not found – try a postcode', 'info'); return; }
      const dest = {lat:+data[0].lat, lon:+data[0].lon, name:data[0].display_name};
      await routeTo(pos, dest);
    } catch {
      alertMsg('Search failed', 'info');
    }
  }

  async function routeTo(from, to) {
    alertMsg('Calculating…', 'info');
    currentDest = to;
    const url = `${OSRM}${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson&steps=true`;
    try {
      const r = await fetch(url);
      const data = await r.json();
      if (data.code !== 'Ok' || !data.routes.length) {
        alertMsg('No route found', 'info');
        return;
      }
      const route = data.routes[0];
      draw(route, to);
      parse(route.legs[0].steps);
      setEta(route);
      document.getElementById('hud').classList.add('active');
      lastAnnounceDist = -1;
      offRouteCount = 0;
      const first = steps[0];
      if (first) {
        speak('Route calculated. ' + cleanVoice(first.instruction) + '. In ' + first.distStr);
      } else {
        speak('Route calculated. Start driving.');
      }
      alertMsg('Route ready', 'success');
    } catch {
      alertMsg('Routing failed', 'info');
    }
  }

  function draw(route, dest) {
    if (routeLine) map.removeLayer(routeLine);
    if (glowLine) map.removeLayer(glowLine);
    if (destMarker) map.removeLayer(destMarker);

    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

    glowLine = L.polyline(coords, {
      color: '#00f0ff', weight: 14, opacity: 0.18, lineCap: 'round'
    }).addTo(map);

    routeLine = L.polyline(coords, {
      color: '#00f0ff', weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round'
    }).addTo(map);

    destMarker = L.marker([dest.lat, dest.lon], {
      icon: L.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;background:#ff6bcb;border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 10px #ff6bcb;"></div>',
        iconSize: [14,14], iconAnchor: [7,7]
      })
    }).addTo(map);

    map.fitBounds(routeLine.getBounds(), {
      paddingTopLeft: [30, 90],
      paddingBottomRight: [50, 220]
    });
  }

  function parse(raw) {
    steps = raw.map(s => {
      const m = s.maneuver || {};
      const type = (m.type || '').toLowerCase();
      const mod = (m.modifier || '').toLowerCase();
      let arrow = '↑';
      if (type === 'arrive') arrow = '●';
      else if (type === 'depart') arrow = '▶';
      else if (mod.includes('left')) arrow = mod.includes('sharp') ? '↰' : '←';
      else if (mod.includes('right')) arrow = mod.includes('sharp') ? '↱' : '→';
      else if (mod.includes('uturn')) arrow = '↩';
      else if (type.includes('roundabout')) arrow = '↻';

      const d = s.distance || 0;
      const distStr = d >= 1000 ? (d/1000).toFixed(1)+' km' : Math.round(d)+' m';
      let instr = type === 'arrive' ? 'You have arrived' :
                  s.name ? (mod || type) + ' onto ' + s.name : (mod || type || 'Continue');

      return {
        instruction: instr,
        arrow,
        distance: d,
        distStr,
        location: m.location,
        type,
        mod
      };
    });
    stepIdx = 0;
    updateHUD();
  }

  function setEta(route) {
    const mins = Math.round(route.duration / 60);
    const km = (route.distance / 1000).toFixed(1);
    const eta = mins < 60 ? mins + ' min' : Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
    document.getElementById('eta-text').textContent = eta;
    document.getElementById('dist-text').textContent = km + ' km';
    document.getElementById('eta-mini').textContent = mins < 60 ? mins+'m' : Math.floor(mins/60)+'h';
    document.getElementById('left-mini').textContent = km + 'km';
    document.getElementById('eta-pill').classList.add('show');

    totalRouteDistance = route.distance || 0;

    const avg = route.distance / route.duration * 3.6;
    let lim = 30;
    if (avg > 75) lim = 70;
    else if (avg > 55) lim = 60;
    else if (avg > 40) lim = 40;
    currentLimit = lim;
    document.getElementById('limit-val').textContent = lim;
  }

  function cleanVoice(text) {
    return text
      .replace(/onto /g, 'onto ')
      .replace(/turn /g, 'turn ')
      .replace(/continue /g, 'continue ')
      .replace(/roundabout/g, 'roundabout')
      .replace(/sharp left/g, 'sharp left')
      .replace(/sharp right/g, 'sharp right');
  }

  function updateHUD() {
    if (!steps.length) return;
    const s = steps[stepIdx];
    document.getElementById('arrow').textContent = s.arrow;
    document.getElementById('instr').textContent = s.instruction;
    document.getElementById('dist').textContent = s.distStr;
  }

  function advanceStep() {
    if (!steps.length || !pos) return;

    const s = steps[stepIdx];
    if (!s || !s.location) return;

    const d = dist(pos.lat, pos.lon, s.location[1], s.location[0]);

    // Live distance update on HUD
    const distText = d >= 1000 ? (d/1000).toFixed(1) + ' km' : Math.round(d) + ' m';
    document.getElementById('dist').textContent = distText;

    // Voice distance announcements at key points
    if (voiceOn) {
      if (d < 80 && lastAnnounceDist !== 50) {
        speak('In 50 metres. ' + cleanVoice(s.instruction));
        lastAnnounceDist = 50;
      } else if (d < 180 && lastAnnounceDist !== 150) {
        speak('In 150 metres. ' + cleanVoice(s.instruction));
        lastAnnounceDist = 150;
      } else if (d < 350 && lastAnnounceDist !== 300) {
        speak('In 300 metres. ' + cleanVoice(s.instruction));
        lastAnnounceDist = 300;
      }
    }

    // Auto advance to next turn when close enough
    if (d < 35 && stepIdx < steps.length - 1) {
      stepIdx++;
      lastAnnounceDist = -1;
      updateHUD();
      const next = steps[stepIdx];
      if (voiceOn && next) {
        if (next.type === 'arrive') {
          speak('You have arrived at your destination.');
        } else {
          speak('Now. ' + cleanVoice(next.instruction));
        }
      }
    } else if (d < 25 && stepIdx === steps.length - 1) {
      // Final arrival
      if (voiceOn && lastSpeak !== 'arrived') {
        speak('You have arrived at your destination.');
        lastSpeak = 'arrived';
      }
    }
  }

  function checkOffRoute() {
    if (!steps.length || !pos || !routeLine) return;
    // Simple off-route: if far from current step and next few points
    const s = steps[stepIdx];
    if (!s || !s.location) return;
    const d = dist(pos.lat, pos.lon, s.location[1], s.location[0]);

    // If more than 120 m from the expected maneuver and still moving
    if (d > 120 && speed > 8) {
      offRouteCount++;
      if (offRouteCount > 4 && currentDest) {
        offRouteCount = 0;
        alertMsg('Recalculating route…', 'info');
        speak('Recalculating route.');
        routeTo(pos, currentDest);
      }
    } else {
      offRouteCount = 0;
    }
  }

  function dist(a,b,c,d) {
    const R = 6371e3, φ1 = a*Math.PI/180, φ2 = c*Math.PI/180;
    const Δφ = (c-a)*Math.PI/180, Δλ = (d-b)*Math.PI/180;
    const x = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  // ===== REAL OSM SPEED CAMERAS via Overpass API =====
  async function fetchNearbyCameras(lat, lon) {
    // Only fetch every 60 seconds to respect Overpass usage
    const now = Date.now();
    if (now - lastCameraFetch < 60000 && nearbyCameras.length) return;
    lastCameraFetch = now;

    const radius = 1500; // metres
    const query = `[out:json][timeout:8];
      node["highway"="speed_camera"](around:${radius},${lat},${lon});
      out body;`;

    try {
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      });
      const data = await res.json();
      nearbyCameras = (data.elements || []).map(el => ({
        lat: el.lat,
        lon: el.lon,
        type: (el.tags && (el.tags['camera:type'] || el.tags.enforcement || 'Speed')) || 'Speed'
      }));
    } catch (e) {
      // Silently fail – cameras are optional
      nearbyCameras = [];
    }
  }

  function checkSpeedLimit() {
    if (!currentLimit || speed < 10) return;
    const overBy = speed - currentLimit;
    // Voice alert when significantly over the limit
    if (overBy >= 8) {
      const now = Date.now();
      if (now - lastOverspeedAlert > 15000) { // max every 15 seconds
        lastOverspeedAlert = now;
        const msg = 'You are exceeding the speed limit. Limit is ' + currentLimit;
        alertMsg('⚠ Over limit (' + currentLimit + ')', 'camera');
        if (voiceOn) speak(msg);
      }
    }
  }

  // Current road name + better speed limit from OSM
  async function fetchRoadAndLimit() {
    if (!pos) return;
    const now = Date.now();
    if (now - lastRoadFetch < 12000) return; // throttle
    lastRoadFetch = now;

    // Reverse geocode for road name (Nominatim)
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${pos.lat}&lon=${pos.lon}&format=json&zoom=17&addressdetails=1`,
        { headers: { 'User-Agent': UA } }
      );
      const data = await r.json();
      const addr = data.address || {};
      const road = addr.road || addr.pedestrian || addr.residential || addr.suburb || data.name || '';
      if (road && road !== currentRoadName) {
        currentRoadName = road;
        const el = document.getElementById('road-name');
        if (el) el.textContent = road;
      }
    } catch (e) { /* ignore */ }

    // maxspeed from Overpass (better limit)
    if (now - lastLimitFetch > 25000) {
      lastLimitFetch = now;
      try {
        const q = `[out:json][timeout:6];
          way(around:40,${pos.lat},${pos.lon})["maxspeed"];
          out tags;`;
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(q),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });
        const data = await res.json();
        if (data.elements && data.elements.length) {
          let maxs = data.elements.map(e => e.tags && e.tags.maxspeed).filter(Boolean);
          // Prefer numeric mph values common in UK
          for (const m of maxs) {
            const num = parseInt(m, 10);
            if (!isNaN(num) && num >= 20 && num <= 70) {
              currentLimit = num;
              document.getElementById('limit-val').textContent = num;
              break;
            }
          }
        }
      } catch (e) { /* ignore */ }
    }
  }

  function updateProgress() {
    if (!totalRouteDistance || !steps.length || !pos) return;
    // Approximate remaining by summing remaining step distances + current step remainder
    let remaining = 0;
    for (let i = stepIdx; i < steps.length; i++) {
      remaining += steps[i].distance || 0;
    }
    // Adjust current step with live distance if available
    if (steps[stepIdx] && steps[stepIdx].location) {
      const d = dist(pos.lat, pos.lon, steps[stepIdx].location[1], steps[stepIdx].location[0]);
      remaining = remaining - (steps[stepIdx].distance || 0) + d;
    }
    remaining = Math.max(0, remaining);
    const pct = Math.min(100, Math.max(0, ((totalRouteDistance - remaining) / totalRouteDistance) * 100));
    const bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = pct.toFixed(1) + '%';

    // Update left distance display
    const leftKm = remaining >= 1000 ? (remaining / 1000).toFixed(1) + 'km' : Math.round(remaining) + 'm';
    document.getElementById('left-mini').textContent = leftKm;
  }

  function checkNearbyCameras() {
    if (!pos) return;
    // Fetch if needed
    fetchNearbyCameras(pos.lat, pos.lon);

    // Check distance to any real camera
    let closest = null;
    let closestDist = 99999;
    for (const cam of nearbyCameras) {
      const d = dist(pos.lat, pos.lon, cam.lat, cam.lon);
      if (d < closestDist) {
        closestDist = d;
        closest = cam;
      }
    }

    // Alert if within 700 m and not too frequent
    if (closest && closestDist < 700) {
      const now = Date.now();
      if (now - lastCameraAlert > 12000) { // max one alert every 12 s
        lastCameraAlert = now;
        const distText = closestDist >= 1000
          ? (closestDist / 1000).toFixed(1) + ' km'
          : Math.round(closestDist) + ' m';
        alertMsg('⚠ Speed camera ' + distText + ' ahead', 'camera');
        if (voiceOn && closestDist < 400) {
          speak('Speed camera in ' + distText);
        }
      }
    }
  }

  function alertMsg(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'show ' + (type || '');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.className = ''; }, 3000);
  }

  function speak(t) {
    if (!voiceOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-GB';
    u.rate = 1.0;
    u.pitch = 1.0;
    // Prefer a clear British voice
    const voices = speechSynthesis.getVoices();
    const gb = voices.find(v => v.lang === 'en-GB') ||
               voices.find(v => v.lang.startsWith('en-GB')) ||
               voices.find(v => v.name && (v.name.includes('British') || v.name.includes('UK') || v.name.includes('English')));
    if (gb) u.voice = gb;
    speechSynthesis.speak(u);
  }

  function toggleVoice() {
    voiceOn = !voiceOn;
    document.getElementById('voice-btn').textContent = voiceOn ? '🔊' : '🔇';
    alertMsg(voiceOn ? 'Voice navigation on' : 'Voice navigation off', 'info');
    if (voiceOn) speak('Voice navigation enabled.');
  }

  function clearRoute() {
    if (routeLine) map.removeLayer(routeLine);
    if (glowLine) map.removeLayer(glowLine);
    if (destMarker) map.removeLayer(destMarker);
    routeLine = glowLine = destMarker = null;
    steps = [];
    stepIdx = 0;
    lastAnnounceDist = -1;
    lastSpeak = '';
    currentDest = null;
    offRouteCount = 0;
    totalRouteDistance = 0;
    currentRoadName = '';
    document.getElementById('hud').classList.remove('active');
    document.getElementById('eta-pill').classList.remove('show');
    const rn = document.getElementById('road-name');
    if (rn) rn.textContent = '—';
    const bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = '0%';
    alertMsg('Route cleared', 'info');
  }

  // Preload voices for better British voice support
  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
  }

  window.addEventListener('load', init);
})();
</script>
